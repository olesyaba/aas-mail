# AAS mail for iPhone + iPad — Xcode project for xcodegen (generated by ios/build_ios.sh).
name: AASMail
options:
  bundleIdPrefix: ru.olesyaba
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: ru.olesyaba.aasmail
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  AASMail:
    type: application
    platform: iOS
    sources:
      - path: AASMail
      - path: stage/app
        type: folder
        buildPhase: resources
      - path: stage/app_packages
        type: folder
        buildPhase: resources
    dependencies:
      - framework: vendor/Python.xcframework
        embed: true
    settings:
      base:
        INFOPLIST_FILE: AASMail/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: AASMail/PyHost.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    postBuildScripts:
      # BeeWare: copy the standard library into the app and turn every .so into a
      # framework iOS can load (see vendor/Python.xcframework/build/utils.sh).
      - name: Install Python
        script: |
          set -e
          source "$PROJECT_DIR/vendor/Python.xcframework/build/utils.sh"
          install_python vendor/Python.xcframework app app_packages
        basedOnDependencyAnalysis: false
