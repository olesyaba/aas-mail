# AAS mail — two apps from one source: AASMailPad (iPad, ru.su-155.aasmail) and
# AASMailPhone (iPhone, ru.su-155.aasmail.iphone). Xcode project for xcodegen (ios/build_ios.sh).
name: AASMail
options:
  bundleIdPrefix: ru.su-155
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # YES + INFOPLIST_FILE: the file is the base, INFOPLIST_KEY_* below add per-app keys.
    GENERATE_INFOPLIST_FILE: YES
targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - path: AASMail
      - path: stage/app
        type: folder
        buildPhase: resources
      - path: stage/app_packages
        type: folder
        buildPhase: resources
    dependencies:
      - framework: vendor/Python.xcframework
        embed: true
    entitlements:
      path: AASMail/AASMail.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        INFOPLIST_FILE: AASMail/Info.plist
        CODE_SIGN_ENTITLEMENTS: AASMail/AASMail.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AASMail/PyHost.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    postBuildScripts:
      # BeeWare: copy the standard library into the app and turn every .so into a
      # framework iOS can load (see vendor/Python.xcframework/build/utils.sh).
      - name: Install Python
        script: |
          set -e
          source "$PROJECT_DIR/vendor/Python.xcframework/build/utils.sh"
          install_python vendor/Python.xcframework app app_packages
        basedOnDependencyAnalysis: false
targets:
  AASMailPad:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.su-155.aasmail
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  AASMailPhone:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.su-155.aasmail.iphone
        TARGETED_DEVICE_FAMILY: "1"
        # One pane under 600px: landscape (844px) would switch a phone to the two-pane layout.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
