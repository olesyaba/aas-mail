<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<script>
/* Theme before first paint (no light flash): last choice cached locally, the
   server copy in prefs wins once loaded. "system" = follow macOS. */
try {
  const t = localStorage.getItem('aas-theme');
  const ok = ['light', 'dark', 'navy-orange', 'navy-orange-light',
    'royal-velvet', 'royal-velvet-light', 'eclipse-almond', 'eclipse-almond-light'];
  if (ok.includes(t)) document.documentElement.dataset.theme = t;
} catch (_) {}
</script>
</head>
<body class="aas-root theme-bank">
<header class="aas-topnav aas-topnav--bank">
  <h1 class="aas-brand" id="brand">AAS mail</h1>
  <div class="aas-tabs" id="tabs">
    <button class="aas-tab aas-tab--bank on" data-view="mail" data-acct="main"><span class="aas-tab__dot"></span>Alfa почта<span class="aas-badge" hidden></span></button>
    <button class="aas-tab aas-tab--bank" data-view="cal" data-acct="main"><span class="aas-tab__dot"></span>Alfa календарь</button>
  </div>

  <input id="search" type="search" placeholder="Поиск по почте">
  <span id="synctxt" class="aas-sync__txt"></span>
  <button class="aas-btn aas-sync" id="syncbtn" title="Принудительная синхронизация почты и календаря с сервером"><span class="aas-sync__ic ic">⟳</span><span class="lbl">Синхронизировать</span></button>
  <button class="aas-btn aas-btn--primary" id="newbtn">Создать</button>
  <button class="aas-btn aas-btn--ghost aas-setbtn" id="setbtn" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button type="button" class="aas-status-dot" id="dot" title="Нет связи с почтовым сервером (VPN, пароль или сбой сервера). Нажмите, чтобы повторить. Пока связь есть — этой плашки не видно.">Нет связи</button>

<main>
  <section class="view on" id="mail">
    <nav id="folders" class="aas-folders"></nav>
    <div id="list">
      <div id="listbar" class="aas-listbar"><span id="listtitle">Входящие</span><span class="aas-spacer"></span>

          <option value="date_desc" selected>Новые сверху</option><option value="date_asc">Старые сверху</option>

<div id="ov"><div id="modal" class="aas-modal"></div></div>
<div id="toast" class="aas-toast"></div>

<script>
"use strict";
const TOK = document.querySelector('meta[name=tok]').content;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ACCT = 'main', accounts = [{id: 'main', name: 'Alfa-Bank', green: false}];
async function api(domain, body, acct = ACCT) {
  const r = await fetch('/api/' + domain, {method: 'POST', headers: {'X-Tok': TOK, 'Content-Type': 'application/json'}, body: JSON.stringify({...body, acct})});
  const j = await r.json();
  if (j.ok === false) { const err = new Error(j.message || j.error || 'Ошибка'); err.code = j.error; throw err; }
  return j;
}
let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'aas-toast' + (err ? ' aas-toast--err' : ''); t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', err ? 7000 : 2500);
}
const guard = fn => async (...a) => { try { return await fn(...a); } catch (e) { if (!e.silent) toast(e.message, true); } };
const who = a => !a ? '' : (a.name || a.address || '');
const whoFull = a => !a ? '' : (a.name && a.address ? `${a.name} <${a.address}>` : (a.address || a.name || ''));
// Turn URLs in already-escaped text into links that open outside the app window.
const linkify = h => h.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
/** First Teams/Zoom/Telemost/… URL from location or body (plain or HTML). */
function joinURL(location, body) {
  const preferred = ['teams.microsoft', 'teams.live', 'zoom.us', 'ktalk', 'kontur',
    'meet.google', 'trueconf', 'jazz.sber', 'telemost.yandex', 'webex.com'];
  const strip = s => String(s || '')
    .replace(/\\\//g, '/')
    .replace(/&amp;/gi, '&')
    .replace(/<[^>]+>/g, ' ');
  const blobs = [];
  for (const raw of [location, body]) {
    if (!raw) continue;
    blobs.push(String(raw), strip(raw));
  }
  const re = /https?:\/\/[^\s<>'")\]]+/gi;
  const urls = [];
  for (const blob of blobs) {
    let m; const r = new RegExp(re);
    while ((m = r.exec(blob))) {
      let u = m[0].replace(/[.,;)\]]+$/, '');
      try { urls.push(new URL(u)); } catch (_) { /* skip */ }
    }
  }
  const hit = urls.find(u => preferred.some(h => (u.host || '').toLowerCase().includes(h)));
  return (hit || urls[0] || null)?.href || '';
}
/* Categories («теги» from Outlook). ActiveSync sends names only — Outlook's colour
   table stays on the server — so each name gets a stable colour from an
   Outlook-like palette, overridable in Settings → Почта → Цвета категорий. */
const CAT_PALETTE = ['#D13438', '#CA5010', '#C19C00', '#498205', '#038387', '#0078D4', '#8764B8', '#E3008C', '#69797E', '#8E562E',
  '#004E8C', '#5C2E91', '#A4262C', '#DA3B01', '#8CBD18', '#00B7C3', '#4F6BED', '#C239B3', '#986F0B', '#107C10'];
const catKey = n => String(n || '').trim();
let catSaveT;
/** Stable, distinct colours: a new category takes the first palette colour no other
 *  category uses yet (starting from a hash of its name) and keeps it in prefs. */
/** Each mailbox keeps its own category colours: Bank «Проект» and Seller «Проект»
 *  are different tags. Bank stays in the original `category_colors`. */
const catPref = (acct = ACCT) => acct === 'main' ? 'category_colors' : 'category_colors_' + acct;
function catColor(name, acct = ACCT) {
  const n = catKey(name), key = catPref(acct), map = prefs[key] ||= {};
  if (map[n]) return map[n];
  let h = 0; for (const ch of n.toLowerCase()) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const used = new Set(Object.values(map).map(c => c.toLowerCase()));
  let col = CAT_PALETTE[h % CAT_PALETTE.length];
  for (let i = 0; i < CAT_PALETTE.length; i++) {
    const c = CAT_PALETTE[(h + i) % CAT_PALETTE.length];
    if (!used.has(c.toLowerCase())) { col = c; break; }
  }
  map[n] = col;
  clearTimeout(catSaveT); catSaveT = setTimeout(() => savePrefs(Object.fromEntries(accounts.map(a => [catPref(a.id), prefs[catPref(a.id)] || {}]))), 1500);
  return col;
}
/** Text colour for a category fill: whichever of white / near-black has the higher
 *  WCAG contrast (a brightness threshold put white on mustard and olive). */
function inkOn(hex) {
  const v = parseInt(hex.slice(1), 16);
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const L = 0.2126 * lin(v >> 16) + 0.7152 * lin((v >> 8) & 255) + 0.0722 * lin(v & 255);
  const vsWhite = 1.05 / (L + 0.05), vsDark = (L + 0.05) / (0.0165 + 0.05);  // #1f2328 ≈ L 0.0165
  return vsDark > vsWhite ? '#1f2328' : '#fff';
}
const uniqCats = list => [...new Set((list || []).map(catKey).filter(Boolean))];
const catChips = list => uniqCats(list).map(n => (seenCat(n), n)).map(n => `<span class="aas-cat" style="--cat:${catColor(n)}">${esc(n)}</span>`).join('');
const seenCats = {};  // acct → category names met in its mail/calendar this session (for Settings)
const seenCat = (n, acct = ACCT) => (seenCats[acct] ||= new Set()).add(catKey(n));
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' МБ' : n > 1024 ? Math.round(n / 1024) + ' КБ' : n + ' Б';
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function fmtDate(s) {  // "YYYY-MM-DD HH:MM" local from the API
  if (!s) return '';
  const [d, t] = s.split(' '); const now = new Date();
  return d === isoDay(now) ? t : `${d.slice(8)}.${d.slice(5, 7)}` + (d.slice(0, 4) !== String(now.getFullYear()) ? '.' + d.slice(0, 4) : '') + ' ' + t;
}

/* ---------- preferences (kept on the server) ---------- */
let prefs = {signature: '', signature2: '', sig_replies: true, threads: true, auto_sync: 2, cal_view: 'week', links: [], favorite_folders: [], theme: 'system', mail_sound: 'notice14', mail_sort: 'date_desc'};
/** Default light/dark/system + StylesBA (dark where readable, plus light variants). */
const THEME_IDS = ['light', 'dark',
  'navy-orange', 'navy-orange-light',
  'royal-velvet', 'royal-velvet-light',
  'eclipse-almond', 'eclipse-almond-light'];
/** Apply a theme choice to the page and to the native shell (window chrome, tray, reminders). */
function applyTheme(t) {
  t = THEME_IDS.includes(t) ? t : 'system';
  if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem('aas-theme', t); } catch (_) {}
  try { window.webkit?.messageHandlers?.aasTheme?.postMessage(t); } catch (_) {}
}
/** Settings the native shell acts on (tray reminders, new-mail sound). */
function syncNativePrefs() {
  try {
    window.webkit?.messageHandlers?.aasPrefs?.postMessage({
      reminder_minutes: prefs.reminder_minutes ?? 5,
      mail_sound: prefs.mail_sound || 'notice14',
    });
  } catch (_) {}
}
let unreadByAcct = {}; // acctId -> {folders: {id:n}, total:n}
let aboutMeta = {name: 'AAS mail', version: '', description: '', contact_mm: '@olesya_ba'};
async function savePrefs(patch) { Object.assign(prefs, patch); try { await api('prefs', {set: patch}); } catch (e) { toast('Не удалось сохранить настройки', true); } }

/* ---------- modal ---------- */
/* The modal can be dragged by its title. Once moved it "floats": the backdrop goes
   away and the page stays usable, so the letter or calendar can be read while
   replying / planning. Typed text is never dropped without asking. */
const modalOpen = () => $('#ov').classList.contains('on');
const modalDirty = () => modalOpen() && $('#modal').dataset.dirty === '1';
const confirmDiscard = () => !modalDirty() || confirm('Закрыть окно? Введённый текст пропадёт.');
function openModal(html) {
  if (!confirmDiscard()) { const e = new Error('cancelled'); e.silent = true; throw e; }
  const m = $('#modal');
  if (!$('#ov').classList.contains('floating')) resetModalPos();  // a floating window keeps its place
  m.innerHTML = html; delete m.dataset.dirty; $('#ov').classList.add('on'); return m;
}
function closeModal() { $('#ov').classList.remove('on'); $('#modal').innerHTML = ''; delete $('#modal').dataset.dirty; resetModalPos(); }
const closeModalSafe = () => { if (confirmDiscard()) closeModal(); };
$('#modal').addEventListener('input', () => { $('#modal').dataset.dirty = '1'; });
$('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') closeModalSafe(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen()) closeModalSafe(); });
/** AAS-24-07: ↑/↓ (or k/j) walk the mail list and open the letter, like Outlook.
 *  Ignored while typing, in a modal, or outside the mail view; focus stays put. */
function listStep(dir) {
  const rows = [...document.querySelectorAll('#rows .aas-row')];
  if (!rows.length) return null;
  const i = rows.findIndex(r => r.dataset.key === curKey);
  const next = rows[i < 0 ? 0 : Math.min(rows.length - 1, Math.max(0, i + dir))];
  if (!next || next.dataset.key === curKey) return null;
  const g = groupsOnScreen().find(x => x.key === next.dataset.key);
  if (!g) return null;
  openGroup(g);
  next.scrollIntoView?.({block: 'nearest'});
  return g.key;
}
document.addEventListener('keydown', e => {
  if (view !== 'mail' || modalOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target, tag = (t?.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || t?.isContentEditable) return;
  const dir = {ArrowDown: 1, j: 1, ArrowUp: -1, k: -1}[e.key];
  if (!dir) return;
  e.preventDefault();
  listStep(dir);
});

let modalOff = {x: 0, y: 0};
function resetModalPos() {
  modalOff = {x: 0, y: 0}; $('#modal').style.transform = ''; $('#ov').classList.remove('floating');
}
(() => {
  const m = $('#modal');
  let drag = null;  // {sx, sy, x0, y0, base, moved}
  m.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !e.target.closest('h3')) return;
    const r = m.getBoundingClientRect();
    // Untransformed box, for clamping: the title must stay reachable on screen.
    drag = {sx: e.clientX, sy: e.clientY, x0: modalOff.x, y0: modalOff.y, moved: false,
      base: {left: r.left - modalOff.x, top: r.top - modalOff.y, width: r.width}};
    try { m.setPointerCapture(e.pointerId); } catch (_) { /* synthetic pointer */ }
    e.preventDefault();
  });
  m.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;  // a click, not a drag
    drag.moved = true;
    const {left, top, width} = drag.base;
    const x = Math.min(Math.max(drag.x0 + dx, 60 - left - width), innerWidth - 60 - left);
    const y = Math.min(Math.max(drag.y0 + dy, -top), innerHeight - 40 - top);
    modalOff = {x, y}; m.style.transform = `translate(${x}px, ${y}px)`;
    $('#ov').classList.add('floating');
  });
  const end = () => { drag = null; };
  m.addEventListener('pointerup', end); m.addEventListener('pointercancel', end);
  m.addEventListener('dblclick', e => { if (e.target.closest('h3')) resetModalPos(); });
})();

/* ---------- tabs ---------- */
let view = 'mail';
const bindTab = b => b.onclick = () => showView(b.dataset.view, b.dataset.acct || 'main');
document.querySelectorAll('.aas-tab').forEach(bindTab);
function buildAccountTabs() {
  const box = $('#tabs') || $('.aas-tabs');
  accounts.filter(a => a.green).forEach(a => {
    const sep = document.createElement('span'); sep.className = 'aas-sep'; box.appendChild(sep);
    [['mail', 'Почта'], ['cal', 'Календарь']].forEach(([v, t]) => {
      const b = document.createElement('button'); b.className = 'aas-tab aas-tab--seller'; b.dataset.view = v; b.dataset.acct = a.id;
      b.innerHTML = `<span class="aas-tab__dot"></span>${esc(a.name)} · ${t}` + (v === 'mail' ? '<span class="aas-badge" hidden></span>' : '');
      bindTab(b); box.appendChild(b);
    });
  });
  paintTabBadges();
}
function setBrand() {
  const a = accounts.find(x => x.id === ACCT) || accounts[0];
  $('#brand').textContent = aboutMeta.name || 'AAS mail';
  document.title = aboutMeta.name + (view === 'cal' ? ' · календарь' : ' · почта') + (a?.green ? ' · ' + a.name : '');
}
/* AAS-24-01: which account refused the password. Tabs of that account get a red
   mark + tooltip; each new refusal is announced once, by name (and login). */
const authShown = {};
function applyAuthState(list) {
  (list || []).forEach(x => {
    const acc = accounts.find(a => a.id === x.id); if (acc) acc.auth_error = x.auth_error || null;
    if (x.auth_error && authShown[x.id] !== x.auth_error) toast(x.auth_error, true);
    authShown[x.id] = x.auth_error || null;
  });
  document.querySelectorAll('.aas-tab').forEach(b => {
    const err = accounts.find(a => a.id === (b.dataset.acct || 'main'))?.auth_error;
    b.classList.toggle('aas-tab--autherr', !!err);
    if (err) b.title = err; else b.removeAttribute('title');
  });
  paintTabBadges();  // mail tabs: counters tooltip unless a refusal must be shown
}
async function checkAuth() {
  try { applyAuthState((await api('accounts', {})).accounts); } catch (_) { /* server down: the status pill says so */ }
}
/** Inbox unread of one account — the rule for tab badges and the Dock badge. */
function inboxUnread(acct) {
  const u = unreadByAcct[acct] || {}, inbox = inboxIds[acct];
  return (inbox && u.folders && u.folders[inbox] != null) ? u.folders[inbox] : (u.total || 0);
}
let dockBadgeSent = null;
function paintTabBadges() {
  document.querySelectorAll('.aas-tab[data-view=mail]').forEach(b => {
    const badge = b.querySelector('.aas-badge'); if (!badge) return;
    const acct = b.dataset.acct || 'main';
    const u = unreadByAcct[acct] || {};
    // Tab shows Inbox unread (Outlook-style), not the sum of every opened folder.
    const n = inboxUnread(acct);
    badge.hidden = !n;
    badge.textContent = n > 99 ? '99+' : String(n);
    const auth = accounts.find(a => a.id === acct)?.auth_error;
    b.title = auth || `Входящие: ${n} непрочитанных · всего в ящике: ${u.total || 0}`;
  });
  // AAS-24-05: same rule on the Dock icon (sum of every account's Inbox).
  const total = accounts.reduce((sum, a) => sum + inboxUnread(a.id), 0);
  if (total !== dockBadgeSent) {
    dockBadgeSent = total;
    try { window.webkit?.messageHandlers?.aasBadge?.postMessage(total); } catch (_) {}
  }
}
/** Background results from the server (e.g. invitation mails sent after a meeting
 *  was created) arrive with the unread counters; each is shown once. */
function showNotices(j) {
  for (const n of j?.notices || []) toast(n.text, n.error);
}
/** Poll a little after an action whose outcome comes later (≤ 3 min). */
function watchNotices(acct = ACCT) {
  let left = 18;
  const tick = async () => {
    try { const j = await api('unread', {}, acct); if ((j.notices || []).length) { showNotices(j); return; } } catch (_) {}
    if (--left > 0) setTimeout(tick, 10000);
  };
  setTimeout(tick, 5000);
}
function setUnread(acct, j) {
  unreadByAcct[acct] = {folders: j.folders || {}, total: j.total || 0, partial: new Set(j.partial || [])};
  reconcileOpenList(acct);
}
/* The badge and the open list must tell the same story. Background work (Inbox

    if (i >= 0) {
      cur[i] = {address, name: name || cur[i].name || '', useCount: (cur[i].useCount || 1) + 1, lastUsed: now};
    } else {
      cur.push({address, name, useCount: 1, lastUsed: now});
    }
  }
  cur.sort((a, b) => (b.useCount - a.useCount) || (b.lastUsed - a.lastUsed));
  saveRecentPeople(cur);
}
function rememberAddrsFromFields(...fields) {
  const people = [];
  for (const s of fields) {
    for (const tok of splitAddrs(s)) {
      const address = addrOnly(tok);
      if (!address.includes('@')) continue;
      const m = tok.match(/^\s*(.*?)\s*<[^>]+>\s*$/);
      people.push({address, name: (m && m[1] ? m[1].replace(/^["']|["']$/g, '').trim() : '')});
    }
  }
  rememberPeople(people);
}
function filterRecentPeople(q, limit = 8) {
  const needle = (q || '').trim().toLowerCase();
  const all = loadRecentPeople();
  if (!needle) return all.slice(0, limit);
  return all.filter(p =>
    (p.name || '').toLowerCase().includes(needle) ||
    (p.address || '').toLowerCase().includes(needle)
  ).slice(0, limit);
}

/**
 * Autocomplete for To/Cc/attendees: recent contacts instantly, GAL after 2+ chars,
 * keyboard nav, replaces only the last incomplete token.
 */
function bindPeopleInput(inp) {
  if (!inp || inp._peopleBound) return;
  inp._peopleBound = true;
  inp.setAttribute('autocomplete', 'off');
  inp.setAttribute('spellcheck', 'false');

  let wrap = inp.closest('.aas-people');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.className = 'aas-people';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
  }
  // Portal to #ov so a scrollable modal does not clip the list.
  let dd = document.querySelector('.aas-people__dd[data-for="' + CSS.escape(inp.id || '') + '"]');
  if (!dd || !inp.id) {
    dd = document.createElement('div');
    dd.className = 'aas-people__dd';
    if (inp.id) dd.dataset.for = inp.id;
    dd.hidden = true;
    (document.getElementById('ov') || document.body).appendChild(dd);
  }

  let timer = null, tok = 0, items = [], idx = -1, lastQ = '';

  const place = () => {
    const r = inp.getBoundingClientRect();
    dd.style.position = 'fixed';
    dd.style.left = Math.round(r.left) + 'px';
    dd.style.width = Math.round(r.width) + 'px';
    dd.style.top = Math.round(r.bottom + 3) + 'px';
    dd.style.right = 'auto';
  };
  const hide = () => { dd.hidden = true; dd.innerHTML = ''; items = []; idx = -1; };
  const prefixAndToken = () => {
    const v = inp.value;
    let depth = 0, lastSep = -1, quoted = false;
    for (let i = 0; i < v.length; i++) {
      const ch = v[i];
      if (ch === '"') quoted = !quoted;
      else if (quoted) continue;
      else if (ch === '<') depth++;
      else if (ch === '>') depth = Math.max(0, depth - 1);
      else if ((ch === ',' || ch === ';' || ch === '\n') && depth === 0) lastSep = i;
    }
    const pre = lastSep >= 0 ? v.slice(0, lastSep + 1) : '';
    const rawToken = lastSep >= 0 ? v.slice(lastSep + 1) : v;
    return {pre, token: rawToken.replace(/^\s+/, ''), rawToken};
  };

  const paint = (list, {loading, empty} = {}) => {
    items = list || [];
    idx = items.length ? 0 : -1;
    place();
    if (loading && !items.length) {
      dd.innerHTML = '<div class="aas-people__hint">Ищу в каталоге…</div>';
      dd.hidden = false;
      return;
    }
    if (!items.length) {
      dd.innerHTML = empty ? `<div class="aas-people__hint">${esc(empty)}</div>` : '';
      dd.hidden = !empty;
      return;
    }
    dd.innerHTML = items.map((p, i) => {
      const sub = [p.address, p.title || p.department].filter(Boolean).join(' · ');
      const badge = p._recent ? '<span class="aas-people__badge">недавний</span>' : '';
      return `<button type="button" class="aas-people__opt${i === idx ? ' on' : ''}" data-i="${i}">
        <span class="aas-people__name">${esc(p.name || p.address)}${badge}</span>
        <span class="aas-people__sub">${esc(sub)}</span>
      </button>`;
    }).join('');
    dd.hidden = false;
    dd.querySelectorAll('.aas-people__opt').forEach(btn => {
      btn.onmousedown = e => { e.preventDefault(); pick(+btn.dataset.i); };
    });
  };

  const pick = i => {
    const p = items[i]; if (!p) return;
    const {pre} = prefixAndToken();
    const formatted = formatPerson(p);
    const needsSep = pre.length && !/[,;\s]$/.test(pre);
    inp.value = pre + (needsSep ? ', ' : '') + formatted + ', ';
    rememberPeople([p]);
    hide();
    inp.focus();
    const pos = inp.value.length;
    inp.setSelectionRange(pos, pos);
  };

  const run = async () => {
    const {token} = prefixAndToken();
    const q = token.trim();
    lastQ = q;
    if (!q) { hide(); return; }

    const local = filterRecentPeople(q, 8).map(p => ({...p, _recent: true}));
    if (q.length < 2) {
      paint(local, {empty: local.length ? '' : 'Введите ещё символ'});
      return;
    }

    // Show local hits immediately; refresh with GAL when it returns.
    paint(local, {loading: true});
    const my = ++tok;
    try {
      const j = await api('people', {action: 'find', query: q, limit: 10});
      if (my !== tok || lastQ !== q) return;
      const seen = new Set(local.map(p => (p.address || '').toLowerCase()));
      const remote = (j.items || []).filter(p => p.address && !seen.has(p.address.toLowerCase()));
      const merged = local.concat(remote).slice(0, 12);
      paint(merged, {empty: merged.length ? '' : 'Никого не найдено'});
    } catch (_) {
      if (my !== tok) return;
      paint(local, {empty: local.length ? '' : 'Каталог недоступен'});
    }
  };

  inp.addEventListener('input', () => {
    clearTimeout(timer);
    const {token} = prefixAndToken();
    // Local filter is sync and cheap — paint on first tick.
    if (token.trim()) {
      const local = filterRecentPeople(token.trim(), 8).map(p => ({...p, _recent: true}));
      if (local.length) paint(local, {loading: token.trim().length >= 2});
    } else hide();
    timer = setTimeout(run, token.trim().length >= 2 ? 180 : 60);
  });
  inp.addEventListener('keydown', e => {
    if (dd.hidden || !items.length) {
      if (e.key === 'Escape') hide();
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = (idx + 1) % items.length; paint(items); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = (idx - 1 + items.length) % items.length; paint(items); }
    else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); pick(idx); }
    else if (e.key === 'Tab' && idx >= 0 && !e.shiftKey) { e.preventDefault(); pick(idx); }
    else if (e.key === 'Escape') { e.preventDefault(); hide(); }
  });
  inp.addEventListener('blur', () => setTimeout(hide, 120));
  inp.addEventListener('focus', () => {
    const {token} = prefixAndToken();
    if (token.trim()) run();
    else {
      const top = filterRecentPeople('', 6).map(p => ({...p, _recent: true}));
      if (top.length) paint(top);
    }
  });
}

/** Outlook-style tail of a reply/forward, as the recipient will see it under your
 *  text: separator, От / Отправлено / Кому / Копия / Тема, then the original.
 *  The server adds the same block when sending (read-only preview here). */

}

function composeForm(ctx) {

/**
 * Column layout for one day's timed events (sorted by start, longer first).
 * Events are split into conflict groups (chains of overlaps); lanes are packed
 * greedily inside each group, and the group's lane count sets its width, so a
 * lone meeting stays full-width even if another hour of the day has 3 clashes.
 * Sets e._l (lane) and e._n (lanes in its group).

function layoutLanes(timed) {
  let group = [], lanes = [], groupEnd = -Infinity;
  const close = () => { group.forEach(g => g._n = Math.max(1, lanes.length)); group = []; lanes = []; };
  timed.forEach(e => {
    const s = e.s.getTime(), en = Math.max(e.e.getTime(), s + 1);

    lanes[l] = en; e._l = l; group.push(e);
    groupEnd = Math.max(groupEnd, en);

}

      <div class="aas-locrow"><input type="text" id="eloc" value="${esc(e?.location || '')}" placeholder="Переговорная или https://…">
      ${(prefs.links || []).length ? `<select id="elink" title="Подставить сохранённую ссылку"><option value="">Мои ссылки…</option>${prefs.links.map((l, i) => `<option value="${i}">${esc(l.name)}</option>`).join('')}</select>` : ''}</div>
      ${(prefs.links || []).length ? '' : '<div class="hint">Свои ссылки на встречи (Telemost, KTalk…) можно сохранить в «Настройки → Почта».</div>'}</div>
    <div class="f"><label>Участники</label><div class="aas-people"><input type="text" id="eatt" placeholder="фамилия или email" value="${esc(attStr)}"></div>
      <div class="hint">Подсказки из недавних и каталога — Enter/Tab подставляют.</div></div>
    <div class="f" id="avw"><button class="aas-btn" id="eavail" type="button">Проверить занятость</button><div class="hint">Проверка запускается автоматически при изменении участников или времени (как в OWA Widget).</div><div id="avres" class="hint"></div></div>
    <div class="f"><label>Описание</label>
      <textarea id="ebody" rows="4">${esc(e?.body || '')}</textarea></div>
    ${editing || !(accounts.find(a => a.id === ACCT) || {}).green ? '' : `<div class="f"><label class="chk aas-toggle"><input type="checkbox" class="aas-sw" id="emime" checked> Разослать участникам приглашения письмом</label>
      <div class="hint">Сервер ${esc((accounts.find(a => a.id === ACCT) || {}).name || 'Seller')} сам приглашения не отправляет — без этой галочки участники не узнают о встрече. В Alfa-Bank приглашения рассылает Exchange, поэтому там этой опции нет.</div></div>`}
    <div class="f" id="repw" ${editing ? 'style="display:none"' : ''}><label>Повторять</label><select id="erep"><option value="">Не повторять</option><option value="daily">Каждый день</option><option value="weekly">Каждую неделю</option><option value="monthly">Каждый месяц</option></select></div>
    <div class="acts2"><button class="aas-btn" id="ecancel">Отмена</button><button class="aas-btn aas-btn--primary" id="esave">${editing ? 'Сохранить' : 'Создать'}</button></div>`);
  bindPeopleInput($('#eatt'));
  const sel = $('#elink');
  // A saved link goes where people look for it: «Место» (the Join button reads it
  // in the calendar, tray and attendees' Outlook) and, bare, into the description.
  if (sel) sel.onchange = () => {
    const l = prefs.links[+sel.value]; sel.value = ''; if (!l) return;
    $('#eloc').value = l.url;
    const b = $('#ebody');
    if (!b.value.includes(l.url)) b.value = (b.value.trim() ? b.value.replace(/\s*$/, '\n\n') : '') + l.url;
  };
  const av = $('#eavail');
  let avTok = 0;
  const runAvailability = guard(async () => {
    if (!$('#avres')) return;
    const st = new Date($('#est').value), en = new Date($('#een').value);
    const att = splitAddrs($('#eatt').value).map(addrOnly).filter(Boolean);
    const box = $('#avres');
    if (isNaN(st) || isNaN(en) || en <= st) { box.textContent = ''; return; }
    if (!att.length) { box.textContent = ''; return; }
    const tok = ++avTok; box.textContent = 'Проверяю…';
    let j;
    try { j = await api('people', {action: 'availability', who: att, start: isoLocal(st), end: isoLocal(en)}); }
    catch (x) {   // e.g. Stalwart (Seller) has no free/busy lookup: check only our own calendar
      if (tok !== avTok) return;
      const l = await api('events', {action: 'list', start: isoDay(st), end: isoDay(new Date(en.getTime() + 864e5)), limit: 300});
      if (tok !== avTok) return;
      const hit = (l.items || []).filter(e => { const es = new Date(e.start_iso), ee = e.end ? localDate(e.end) : es; return es < en && ee > st && e.busy_status !== 'free'; });
      box.innerHTML = '<div>ℹ️ Этот сервер не отдаёт занятость участников — проверен только ваш календарь.</div>' +
        (hit.length ? hit.map(e => `<div>⛔ Пересечение: ${esc(e.subject || '(без темы)')} (${new Date(e.start_iso).toLocaleTimeString('ru-RU', {timeStyle: 'short'})})</div>`).join('') : '<div>✅ У вас в это время свободно</div>');
      return;
    }
    if (tok !== avTok) return;
    const L = {'0': ['свободен', 'ok'], '1': ['под вопросом', 'warn'], '2': ['занят', 'bad'], '3': ['вне офиса', 'bad'], '4': ['нет данных', '']};
    const rows = (j.items || []).map(x => {
      const fb = x.freebusy || ''; const w = ['2', '3', '1', '0'].find(c => fb.includes(c)) || '4'; const [t, c] = L[w];
      return `<div>${c === 'ok' ? '✅' : c === 'warn' ? '⚠️' : c === 'bad' ? '⛔' : '❔'} ${esc(x.name || x.address)} — ${t}</div>`; });
    (j.unresolved || []).forEach(u => rows.push(`<div>❔ ${esc(u.query)} — не найден/неоднозначен, занятость неизвестна</div>`));
    box.innerHTML = rows.join('') || 'Нет данных';
    if ((j.items || []).some(x => /[23]/.test(x.freebusy || ''))) {
      try { const f = await api('people', {action: 'find_free_slots', who: att, duration_minutes: Math.max(15, Math.round((en - st) / 6e4)), start: isoLocal(st), count: 3});
        if (tok !== avTok) return;
        const slotLabel = x => { const a = new Date(x.start_iso), b = new Date(x.end_iso);
          return `${a.toLocaleDateString('ru-RU', {weekday: 'short', day: 'numeric', month: 'numeric'})}, ${pad(a.getHours())}:${pad(a.getMinutes())}–${pad(b.getHours())}:${pad(b.getMinutes())}`; };
        if ((f.items || []).length) box.innerHTML += `<div style="margin-top:6px">Свободно у всех (рабочий день ${pad(f.work_start ?? prefs.work_start)}:00–${pad(f.work_end ?? prefs.work_end)}:00):</div>`
          + '<div class="aas-slots">' + f.items.map(x => `<button class="aas-btn aas-btn--sm" type="button" data-s="${esc(x.start_iso)}" data-e="${esc(x.end_iso)}">${esc(slotLabel(x))}</button>`).join('') + '</div>';
        box.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { $('#est').value = isoLocal(new Date(b.dataset.s)); $('#een').value = isoLocal(new Date(b.dataset.e)); runAvailability(); });
      } catch (x) { /* slots are a nicety */ } }
  });
  if (av) {
    av.onclick = runAvailability;
    // OWA-like: auto-check after attendee/time edits (debounced).
    let avT;
    const arm = () => { clearTimeout(avT); avT = setTimeout(() => runAvailability(), 450); };
    ['eatt', 'est', 'een'].forEach(id => { const el = $('#' + id); if (el) el.addEventListener('change', arm); });
    $('#eatt')?.addEventListener('input', arm);
  }
  $('#ecancel').onclick = closeModal;
  $('#esave').onclick = guard(async () => {
    const all = $('#eall').checked; let mimeFailed = false;
    let st = new Date($('#est').value), en2 = new Date($('#een').value);
    if (isNaN(st) || isNaN(en2) || en2 <= st) { if (!all) throw new Error('Проверьте время: конец должен быть позже начала'); }
    const p = {subject: $('#esub').value, location: $('#eloc').value, body: $('#ebody').value, all_day: all,
      start: all ? isoDay(st) + 'T00:00' : isoLocal(st), end: all ? isoDay(new Date(Math.max(en2, st).getTime() + (en2 <= st ? 864e5 : 0))) + 'T00:00' : isoLocal(en2)};
    if (all && p.end <= p.start) p.end = isoDay(new Date(st.getTime() + 864e5)) + 'T00:00';
    if (editing) {
      const att = splitAddrs($('#eatt').value).map(addrOnly).filter(Boolean);
      if (att.length) p.attendees = att;
      else p.attendees = [];  // explicit empty — clear/keep server meeting roster via update patch
      await api('events', {action: 'update', item_id: e.item_id, ...p}, e._acct || ACCT);
      rememberAddrsFromFields($('#eatt').value);
    } else {
      const att = splitAddrs($('#eatt').value).map(addrOnly).filter(Boolean); if (att.length) p.attendees = att;
      if ($('#erep').value) { p.repeat = $('#erep').value; p.repeat_count = 10; }
      if (att.length && $('#emime')?.checked) p.mime_invite = true;
      const r = await api('events', {action: 'create', ...p});
      rememberAddrsFromFields($('#eatt').value);
      if (r.mime_invite_pending) { mimeFailed = true; toast('Событие создано. Приглашения отправляются письмом — сообщу, когда уйдут.'); watchNotices(); }
    }
    closeModal(); if (!mimeFailed) toast(editing ? 'Сохранено' : 'Событие создано'); loadCal();
  });
}

/* ---------- start ---------- */
$('#selall')?.addEventListener('change', e => {
  if (e.target.checked) groupsOnScreen().forEach(g => selectedKeys.add(g.key));
  else selectedKeys = new Set();
  document.querySelectorAll('.aas-row').forEach(r => {
    const on = selectedKeys.has(r.dataset.key);
    r.classList.toggle('sel', on);
    const cb = r.querySelector('.aas-row__chk input');
    if (cb) cb.checked = on;
  });
  syncBulkBar();
});
$('#bulkclear')?.addEventListener('click', () => {
  selectedKeys = new Set();
  document.querySelectorAll('.aas-row').forEach(r => {
    r.classList.remove('sel');
    const cb = r.querySelector('.aas-row__chk input');
    if (cb) cb.checked = false;
  });
  syncBulkBar();
});
/** Bulk read/unread: clear the selection before the list re-renders (restored if the call fails). */
const bulkMark = read => guard(async () => {
  if (!selectedKeys.size) return toast('Выберите письма');
  const keys = selectedKeys;
  selectedKeys = new Set();
  try { await markGroupsRead(keys, read); }
  catch (e) { selectedKeys = keys; syncBulkBar(); throw e; }
});
$('#bulkread')?.addEventListener('click', bulkMark(true));
$('#bulkunread')?.addEventListener('click', bulkMark(false));

(async () => {
  // Independent boot calls go out together (one round-trip of latency instead of three).
  const [p, m, acc] = await Promise.allSettled([api('prefs', {}), api('about', {}), api('accounts', {})]);
  if (p.status === 'fulfilled') prefs = p.value.prefs;
  applyTheme(prefs.theme); syncNativePrefs();
  if (m.status === 'fulfilled') aboutMeta = m.value;
  if (acc.status === 'fulfilled') accounts = acc.value.accounts;
  setTimeout(() => applyAuthState(accounts), 0);  // tabs exist after buildAccountTabs
  buildAccountTabs(); setBrand();
  calMode = prefs.cal_view; $('#thr').checked = prefs.threads; $('#window').value = String(prefs.mail_window ?? 5); $('#sort').value = prefs.mail_sort || 'date_desc'; armAutoSync();
  if (aboutMeta.needs_setup) {
    toast('Первый запуск: укажите логин и пароль. Адреса серверов уже подставлены.');
    setTimeout(() => $('#setbtn').click(), 200);
  } else {
    await loadFolders();
    refreshFolders().catch(() => {});  // the stored tree may be hours old: delta it
    for (const a of accounts) syncCalDelta(a.id);  // disk cache → delta, also warms the tray
    accounts.forEach(a => sweepUnread(a.id));
    // Prime Inbox unread badges on every account so tab counters appear without a manual sync.
    Promise.allSettled(accounts.map(a => refreshInboxBadge(a.id))).then(() => paintTabBadges());
  }
  if (location.hash === '#cal') showView('cal');
  lastSync = new Date(); setSyncText();
})();
</script>
</body>
